<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscar endereço</title>
<style>
  :root {
    color-scheme: dark;
    --bg1: #1a1538; --bg2: #0e1424; --surface: #1b2140; --surface2: #222a4d; --ink: #eceffb;
    --muted: #a2abc9; --line: #2e3860; --accent: #8b5cf6; --accent-ink: #ffffff;
    --badge-bg: #2b2457; --badge-ink: #c4b0ff; --danger: #ff8a80;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: var(--ink);
         background: linear-gradient(135deg, var(--bg1), var(--bg2));
         font: 16px/1.4 "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 28px 16px 56px; }

  form { display: grid; grid-template-columns: 130px 1fr 1fr auto; gap: 10px; align-items: center;
         background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 10px; }
  #bairro { grid-column: span 2; }
  #rua { grid-column: span 3; }
  select, input { width: 100%; padding: 12px 14px; font: inherit; color: var(--ink);
                  background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; }
  select:disabled, input:disabled { opacity: .5; cursor: not-allowed; }
  ::placeholder { color: var(--muted); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  button.go { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px;
              padding: 12px 26px; font: inherit; font-weight: 600; cursor: pointer; }
  button.go:disabled { opacity: .45; cursor: not-allowed; }

  #formCep { grid-template-columns: 1fr auto; margin-top: 10px; }
  #status { margin: 16px 4px 0; color: var(--muted); min-height: 1.4em; }
  #status.erro { color: var(--danger); }

  #selecionado { margin-top: 14px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--accent);
                 background: var(--surface); display: flex; gap: 12px; justify-content: space-between; align-items: center; }
  #selecionado b { display: block; }
  #selecionado span { color: var(--muted); font-size: .9375rem; }
  #selecionado .coord { display: block; margin-top: 4px; font-variant-numeric: tabular-nums; }
  #selecionado .ver-maps { display: inline-block; margin-left: 10px; padding: 6px 14px; background: var(--accent);
            color: var(--accent-ink); border-radius: 10px; font: inherit; font-size: .875rem; font-weight: 600;
            text-decoration: none; cursor: pointer; white-space: nowrap; }
  #selecionado .ver-maps:hover { filter: brightness(1.12); }
  .copiar { background: none; color: var(--badge-ink); border: 1px solid var(--line); border-radius: 10px;
            padding: 8px 14px; font: inherit; cursor: pointer; white-space: nowrap; }

  [hidden] { display: none !important; }
  #selecionado .lado { display: flex; gap: 8px; align-items: center; }
  #numero { width: 88px; padding: 8px 12px; text-align: center; }

  #painel { margin-top: 14px; background: var(--surface); border: 1px solid var(--line);
            border-radius: 18px; overflow: hidden; }
  .cab { display: flex; justify-content: space-between; gap: 12px; padding: 14px 20px;
         font-size: .8125rem; font-weight: 600; background: var(--surface2); border-bottom: 1px solid var(--line); }
  .cab span:last-child { color: var(--muted); font-weight: 500; }
  ul { list-style: none; margin: 0; padding: 0; max-height: 62vh; overflow-y: auto; }
  li + li { border-top: 1px solid var(--line); }
  .opcao { width: 100%; display: flex; align-items: center; gap: 16px; padding: 16px 20px; text-align: left;
           background: none; color: inherit; border: 0; font: inherit; cursor: pointer; }
  .opcao:hover { background: var(--surface2); }
  .opcao[aria-selected="true"] { background: var(--badge-bg); }
  .cep { font: 700 .9375rem ui-monospace, "SF Mono", Consolas, monospace; color: var(--badge-ink);
         background: var(--badge-bg); padding: 10px 12px; border-radius: 10px; white-space: nowrap; }
  .opcao[aria-selected="true"] .cep { background: var(--accent); color: var(--accent-ink); }
  .txt { flex: 1; min-width: 0; }
  .rua { font-weight: 500; font-size: 1.0625rem; }
  .det { color: var(--muted); font-size: .875rem; margin-top: 2px; }
  .seta { color: var(--muted); font-size: 1.25rem; }

  @media (max-width: 640px) {
    form { grid-template-columns: 1fr 1fr; }
    #cidade, #bairro, #rua, .go { grid-column: 1 / -1; }
    .opcao { gap: 12px; padding: 14px; }
    #selecionado { flex-direction: column; align-items: stretch; }
    #numero { width: auto; flex: 1; }
  }
</style>
</head>
<body>
<main>
  <form id="form" autocomplete="off">
    <select id="uf" aria-label="Estado" required><option value="">UF</option></select>
    <input id="cidade" list="cidades" type="text" placeholder="Cidade" aria-label="Cidade" required disabled>
    <datalist id="cidades"></datalist>
    <input id="bairro" type="text" placeholder="Bairro (opcional)" aria-label="Bairro" disabled>
    <input id="rua" type="text" minlength="3" placeholder="Rua (mín. 3 letras)" aria-label="Rua" required disabled>
    <button class="go" id="buscar" type="submit" disabled>Buscar</button>
  </form>

  <form id="formCep" autocomplete="off">
    <input id="cep" type="text" inputmode="numeric" maxlength="9" placeholder="Ou busque pelo CEP (ex.: 06708-230)" aria-label="CEP">
    <button class="go" id="buscarCep" type="submit" disabled>Buscar</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>

  <div id="selecionado" hidden>
    <div id="selInfo"></div>
    <div class="lado">
      <input id="numero" type="text" maxlength="10" placeholder="Nº" aria-label="Número da casa (opcional)" title="Número da casa (opcional) — melhora a precisão">
      <button type="button" class="copiar" id="copiar">Copiar endereço</button>
    </div>
  </div>

  <section id="painel" hidden>
    <div class="cab"><span id="total"></span><span>Selecione um endereço</span></div>
    <ul id="lista"></ul>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const ufEl = $('uf'), cidadeEl = $('cidade'), bairroEl = $('bairro'), ruaEl = $('rua'), btn = $('buscar'),
      cepEl = $('cep'), btnCep = $('buscarCep'),
      statusEl = $('status'), painel = $('painel'), lista = $('lista'),
      selEl = $('selecionado'), dlCidades = $('cidades'),
      numeroEl = $('numero'), selInfo = $('selInfo'), copiarEl = $('copiar');
let encontrados = [];
let tokenSel = 0;
let atual = null, timerNum;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const semAcento = (t) => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const soDigitos = (t) => t.replace(/\D/g, '');
function setStatus(msg, erro = false) { statusEl.textContent = msg; statusEl.className = erro ? 'erro' : ''; }
function validar() { btn.disabled = !(ufEl.value && cidadeEl.value.trim() && ruaEl.value.trim().length >= 3); }
function limpar() { tokenSel++; clearTimeout(timerNum); atual = null; numeroEl.value = ''; painel.hidden = true; selEl.hidden = true; lista.innerHTML = ''; encontrados = []; }

// Aceita lista direta ou objeto com a lista dentro, e nomes de campos em PT ou EN.
function normalizar(json) {
  let arr = Array.isArray(json) ? json
    : json && (json.data || json.results || json.addresses || json.address || json.items);
  if (!Array.isArray(arr)) arr = json && typeof json === 'object' && (json.cep || json.logradouro) ? [json] : [];
  return arr.map(d => {
    const dig = soDigitos(String(d.cep || d.zipcode || d.postal_code || ''));
    return {
      cep: dig.length === 8 ? dig.slice(0, 5) + '-' + dig.slice(5) : (d.cep_formatado || d.cep || ''),
      logradouro: d.logradouro || d.street || d.address || d.rua || '',
      complemento: d.complemento || d.complement || '',
      bairro: d.bairro || d.neighborhood || d.district || '',
      localidade: d.localidade || d.cidade || d.city || '',
      uf: d.uf || d.state || '',
      latitude: d.latitude || d.lat || d.location?.coordinates?.latitude || '',
      longitude: d.longitude || d.lng || d.lon || d.location?.coordinates?.longitude || ''
    };
  });
}

// APIs públicas: ViaCEP (busca por endereço) e BrasilAPI + ViaCEP (busca por CEP).
async function consultarEnderecos(uf, cidade, rua) {
  const r = await fetch(`https://viacep.com.br/ws/${uf}/${encodeURIComponent(cidade)}/${encodeURIComponent(rua)}/json/`);
  if (!r.ok) throw new Error('http ' + r.status);
  return normalizar(await r.json());
}

async function consultarCep(cep) {
  try {
    const r = await fetch(`https://brasilapi.com.br/api/cep/v2/${cep}`);
    if (r.ok) { const d = normalizar(await r.json()); if (d.length) return d; }
  } catch { /* segue para o ViaCEP */ }
  const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
  if (r.status === 400) return [];
  if (!r.ok) throw new Error('http ' + r.status);
  return normalizar(await r.json());
}

async function carregarEstados() {
  try {
    const r = await fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados?orderBy=nome');
    const estados = await r.json();
    ufEl.innerHTML = '<option value="">UF</option>' +
      estados.map(e => `<option value="${e.sigla}">${e.sigla} · ${e.nome}</option>`).join('');
  } catch { setStatus('Não foi possível carregar os estados. Verifique sua conexão.', true); }
}

ufEl.addEventListener('change', async () => {
  cidadeEl.value = ''; bairroEl.value = ''; bairroEl.disabled = true; ruaEl.value = ''; ruaEl.disabled = true;
  dlCidades.innerHTML = '';
  limpar(); setStatus(''); validar();
  cidadeEl.disabled = !ufEl.value;
  if (!ufEl.value) return;
  cidadeEl.focus();
  try {
    const r = await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${ufEl.value}/municipios?orderBy=nome`);
    const cidades = await r.json();
    dlCidades.innerHTML = cidades.map(c => `<option value="${esc(c.nome)}"></option>`).join('');
  } catch { setStatus('Não foi possível carregar as cidades, mas você pode digitar o nome.', true); }
});

cidadeEl.addEventListener('input', () => {
  const ok = !!cidadeEl.value.trim();
  bairroEl.disabled = !ok; ruaEl.disabled = !ok; validar();
});
ruaEl.addEventListener('input', validar);

function mostrar(dados, msgVazio) {
  encontrados = dados;
  if (encontrados.length === 0) { setStatus(msgVazio); return; }
  setStatus('');
  $('total').textContent = `${encontrados.length} CEP${encontrados.length > 1 ? 's' : ''} encontrado${encontrados.length > 1 ? 's' : ''}`;
  lista.innerHTML = encontrados.map((d, i) => `
    <li><button type="button" class="opcao" data-i="${i}" aria-selected="false">
      <span class="cep">${esc(d.cep)}</span>
      <span class="txt">
        <div class="rua">${esc(d.logradouro || '(sem logradouro)')}</div>
        <div class="det">${esc([d.bairro, d.localidade, d.uf].filter(Boolean).join(' · '))}</div>
      </span>
      <span class="seta" aria-hidden="true">›</span>
    </button></li>`).join('');
  painel.hidden = false;
  if (encontrados.length === 1) lista.querySelector('.opcao').click();
}

// Busca por endereço
$('form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const rua = ruaEl.value.trim();
  if (rua.length < 3) return;
  limpar(); setStatus('Buscando…'); btn.disabled = true;
  try {
    let dados = await consultarEnderecos(ufEl.value, semAcento(cidadeEl.value.trim()), semAcento(rua));
    const bairro = semAcento(bairroEl.value.trim()).toLowerCase();
    let msgVazio = 'Nenhum endereço encontrado. Tente outras letras da rua.';
    if (bairro && dados.length) {
      const total = dados.length;
      dados = dados.filter(d => semAcento(d.bairro).toLowerCase().includes(bairro));
      if (!dados.length) msgVazio = total >= 50
        ? 'Nenhuma rua neste bairro entre os 50 primeiros resultados. Digite mais letras da rua.'
        : 'Nenhuma rua encontrada neste bairro. Confira o nome do bairro.';
    }
    mostrar(dados, msgVazio);
  } catch { setStatus('Erro ao consultar o serviço de CEP. Verifique sua conexão e tente de novo.', true); }
  finally { validar(); }
});

// Busca por CEP
cepEl.addEventListener('input', () => {
  const d = soDigitos(cepEl.value).slice(0, 8);
  cepEl.value = d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d;
  btnCep.disabled = d.length !== 8;
});

$('formCep').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const cep = soDigitos(cepEl.value);
  if (cep.length !== 8) return;
  limpar(); setStatus('Buscando…'); btnCep.disabled = true;
  try {
    mostrar(await consultarCep(cep), 'CEP não encontrado.');
  } catch { setStatus('Erro ao consultar o serviço de CEP. Verifique sua conexão e tente de novo.', true); }
  finally { btnCep.disabled = soDigitos(cepEl.value).length !== 8; }
});

// Coordenadas: usa as da resposta; se não vierem, consulta o Nominatim (OpenStreetMap) só para o endereço selecionado.
const cacheGeo = new Map();

async function geocodificar(d, n) {
  const chave = [d.cep, d.logradouro, n].join('|');
  if (cacheGeo.has(chave)) return cacheGeo.get(chave);
  const comNum = n && d.logradouro ? [
    [`${d.logradouro}, ${n}`, d.bairro, d.localidade, d.uf, 'Brasil'],
    [`${d.logradouro}, ${n}`, d.localidade, d.uf, 'Brasil']
  ] : [];
  const tentativas = comNum.concat([
    [d.logradouro, d.bairro, d.localidade, d.uf, 'Brasil'],
    [d.logradouro, d.localidade, d.uf, 'Brasil'],
    [d.cep, d.localidade, 'Brasil']
  ]).map(p => p.filter(Boolean).join(', '));
  let res = null, aprox = null;
  for (let i = 0; i < tentativas.length && !res; i++) {
    if (i >= comNum.length && aprox) break; // já achou a rua; não precisa de tentativas mais vagas
    if (i) await new Promise(r => setTimeout(r, 1100)); // respeita o limite de 1 consulta/s
    const r = await fetch('https://nominatim.openstreetmap.org/search?' +
      new URLSearchParams({ format: 'jsonv2', limit: '1', countrycodes: 'br', addressdetails: '1', q: tentativas[i] }));
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json();
    if (j[0]) {
      const p = { lat: String(+(+j[0].lat).toFixed(6)), lon: String(+(+j[0].lon).toFixed(6)), exato: !!j[0].address?.house_number };
      if (i < comNum.length && !p.exato) aprox = aprox || p; else res = p;
    }
  }
  res = res || aprox;
  cacheGeo.set(chave, res);
  return res;
}

function coordsDe(d) {
  const la = parseFloat(d.latitude), lo = parseFloat(d.longitude);
  return isFinite(la) && isFinite(lo) ? { lat: String(la), lon: String(lo) } : null;
}

// c: undefined = buscando, null = não encontrada, objeto = {lat, lon, exato}
function renderSel(d, c) {
  const n = numeroEl.value.trim();
  const rua = d.logradouro ? d.logradouro + (n ? ', ' + n : '') : '';
  const local = [d.bairro, `${d.localidade} - ${d.uf}`, 'CEP ' + d.cep].filter(Boolean).join(' · ');
  const mapaEnd = 'https://www.google.com/maps/search/?api=1&query=' +
    encodeURIComponent([d.logradouro && d.logradouro + (n ? ' ' + n : ''), d.bairro, d.localidade, d.uf, d.cep].filter(Boolean).join(', '));
  const btnMapa = `<a class="ver-maps" href="${mapaEnd}" target="_blank" rel="noopener noreferrer">📍 Ver no Google Maps</a>`;
  let coord;
  if (c === undefined) coord = 'Coordenadas: buscando…';
  else if (c === null) coord = 'Coordenadas não encontradas.' + btnMapa;
  else coord = `Latitude ${c.lat} · Longitude ${c.lon}` +
    (n && !c.exato ? ' (aproximado: número não localizado no mapa)' : '') + btnMapa;
  let linha = [rua, d.complemento, d.bairro, `${d.localidade} - ${d.uf}`, `CEP ${d.cep}`].filter(Boolean).join(', ');
  if (c) linha += `, Lat ${c.lat}, Lon ${c.lon}`;
  selInfo.innerHTML = `<b>${esc(rua || '(sem logradouro)')}</b>
    <span>${esc(local)}</span><span class="coord">${coord}</span>`;
  copiarEl.dataset.txt = linha;
  selEl.hidden = false;
}

async function selecionar(d) {
  atual = d;
  const n = numeroEl.value.trim();
  const meu = ++tokenSel;
  renderSel(d, undefined);
  try {
    let c = n ? await geocodificar(d, n) : null;
    if (!c) c = coordsDe(d) || (n ? null : await geocodificar(d, ''));
    if (meu === tokenSel) renderSel(d, c);
  } catch { if (meu === tokenSel) renderSel(d, null); }
}

lista.addEventListener('click', (ev) => {
  const b = ev.target.closest('.opcao');
  if (!b) return;
  lista.querySelectorAll('.opcao').forEach(o => o.setAttribute('aria-selected', 'false'));
  b.setAttribute('aria-selected', 'true');
  selecionar(encontrados[+b.dataset.i]);
});

// Ao digitar o número, atualiza o link do mapa, as coordenadas e o texto copiado.
numeroEl.addEventListener('input', () => {
  clearTimeout(timerNum);
  if (!atual) return;
  timerNum = setTimeout(() => selecionar(atual), 700);
});

selEl.addEventListener('click', async (ev) => {
  const b = ev.target.closest('.copiar');
  if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.txt); b.textContent = 'Copiado'; }
  catch { b.textContent = 'Falhou'; }
  setTimeout(() => { b.textContent = 'Copiar endereço'; }, 1200);
});

carregarEstados();
</script>
</body>
</html>
